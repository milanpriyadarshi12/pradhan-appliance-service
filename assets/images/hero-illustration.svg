<svg width="1600" height="1100" viewBox="0 0 1600 1100" xmlns="http://www.w3.org/2000/svg">
  <!-- PLACEHOLDER HERO VISUAL — replace with a real technician/service photo.
       See assets/images/README.txt for the exact filename to drop in. -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1330"/>
      <stop offset="55%" stop-color="#132a63"/>
      <stop offset="100%" stop-color="#1d3f9e"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#4f7dff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4f7dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e9edf7"/>
      <stop offset="100%" stop-color="#b9c3dc"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1100" fill="url(#bg)"/>
  <rect width="1600" height="1100" fill="url(#glow)"/>

  <!-- soft grid dots for texture -->
  <g fill="#ffffff" opacity="0.06">
    <circle cx="120" cy="120" r="3"/><circle cx="220" cy="120" r="3"/><circle cx="320" cy="120" r="3"/>
    <circle cx="120" cy="220" r="3"/><circle cx="220" cy="220" r="3"/><circle cx="320" cy="220" r="3"/>
    <circle cx="120" cy="320" r="3"/><circle cx="220" cy="320" r="3"/><circle cx="320" cy="320" r="3"/>
  </g>

  <!-- AC unit, upper right -->
  <g transform="translate(1120,140)">
    <rect x="0" y="0" width="340" height="110" rx="18" fill="url(#metal)"/>
    <rect x="18" y="20" width="304" height="16" rx="8" fill="#7f8bb0"/>
    <rect x="18" y="46" width="304" height="16" rx="8" fill="#7f8bb0"/>
    <rect x="18" y="72" width="304" height="16" rx="8" fill="#7f8bb0"/>
    <circle cx="300" cy="95" r="6" fill="#2454e0"/>
  </g>

  <!-- Refrigerator, left -->
  <g transform="translate(140,430)">
    <rect x="0" y="0" width="220" height="420" rx="20" fill="url(#metal)"/>
    <rect x="0" y="140" width="220" height="8" fill="#8b96b8"/>
    <rect x="196" y="30" width="10" height="80" rx="5" fill="#2454e0"/>
    <rect x="196" y="180" width="10" height="80" rx="5" fill="#2454e0"/>
  </g>

  <!-- Washing machine, bottom right -->
  <g transform="translate(1180,760)">
    <rect x="0" y="0" width="280" height="260" rx="20" fill="url(#metal)"/>
    <circle cx="140" cy="150" r="86" fill="#0b1330"/>
    <circle cx="140" cy="150" r="86" fill="none" stroke="#4f7dff" stroke-width="8"/>
    <circle cx="140" cy="150" r="58" fill="none" stroke="#2c3a63" stroke-width="6"/>
    <circle cx="40" cy="34" r="10" fill="#2454e0"/>
    <circle cx="76" cy="34" r="10" fill="#7f8bb0"/>
  </g>

  <!-- Technician figure, center-left foreground -->
  <g transform="translate(430,300)">
    <!-- body -->
    <path d="M60 560 L40 260 C40 190 95 140 170 140 C245 140 300 190 300 260 L280 560 Z" fill="#17204a"/>
    <path d="M60 560 L40 260 C40 190 95 140 170 140 C245 140 300 190 300 260 L280 560 Z" fill="#1d2a5c" opacity="0.6"/>
    <!-- collar accent -->
    <path d="M120 150 L170 190 L220 150 L210 210 L130 210 Z" fill="#2454e0"/>
    <!-- head -->
    <circle cx="170" cy="90" r="66" fill="#f2c9a0"/>
    <!-- cap -->
    <path d="M96 78 C96 32 244 32 244 78 L252 96 L88 96 Z" fill="#2454e0"/>
    <rect x="88" y="88" width="164" height="18" rx="9" fill="#173aad"/>
    <!-- arm + wrench -->
    <path d="M280 300 C340 300 380 340 392 400 L420 470 L384 486 L352 410 C340 380 320 360 290 350 Z" fill="#17204a"/>
    <g transform="translate(392,452) rotate(28)">
      <rect x="0" y="-14" width="120" height="28" rx="14" fill="#e9edf7"/>
      <circle cx="0" cy="0" r="24" fill="none" stroke="#e9edf7" stroke-width="16"/>
    </g>
    <!-- badge -->
    <circle cx="180" cy="330" r="34" fill="#ffffff"/>
    <text x="180" y="341" font-family="Poppins, Arial, sans-serif" font-weight="700" font-size="30" fill="#2454e0" text-anchor="middle">P</text>
  </g>

  <!-- bottom fade for text legibility when used as a background -->
  <rect x="0" y="820" width="1600" height="280" fill="url(#bg)" opacity="0.0"/>
</svg>
